name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSI-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          RELEASE_TAG: android-debug-latest
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TSI Launcher Android Debug APK" \
              --notes "Latest automatically-built TSI Launcher debug APK. This is an unsigned debug build for testing." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
